# Application test gate (ADR-033).
#
# Runs the backend and frontend suites — smoke tests included — on every PR.
# Nothing here holds a credential: the backend tests talk to a throwaway
# MongoDB service container instead of Atlas, and every external API (Gemini,
# Places, Jina, Firecrawl) is mocked by the suite itself. Tests marked `live`
# hit the network and stay opt-in, exactly as they are locally.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend_ml

    # Same major as Atlas. tests/conftest.py and database.py only turn TLS on
    # for Atlas-shaped URIs, so a plain mongodb:// URI talks plaintext here.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGO_URI: mongodb://localhost:27017

    steps:
      # Pinned to commit SHAs, not tags: tags are mutable (same policy as
      # terraform.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.12 is what the production image runs (backend_ml/Dockerfile), so the
      # suite is tested on the interpreter that ships — not on a laptop's.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend_ml/requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: pytest
        run: python -m pytest tests/ -m "not live" -q -p no:cacheprovider

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install dependencies
        run: npm ci

      - name: vitest
        run: npm test

      # A green test run with a broken production bundle is still broken.
      - name: build
        run: npm run build
