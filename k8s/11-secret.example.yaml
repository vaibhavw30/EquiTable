# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE ONLY — this file is committed; the real Secret is NOT.
#
# Every value below is a placeholder. Do not paste real credentials into this
# file: it is tracked in git, and a secret committed once lives in the history
# forever even if a later commit removes it.
#
# Create the real Secret from your local .env instead, which is gitignored:
#
#   kubectl create secret generic equitable-secrets \
#     --namespace equitable \
#     --from-env-file=backend_ml/.env
#
# Or explicitly, key by key:
#
#   kubectl create secret generic equitable-secrets \
#     --namespace equitable \
#     --from-literal=MONGO_URI='mongodb+srv://...' \
#     --from-literal=GEMINI_API_KEY='...' \
#     --from-literal=LANGCHAIN_API_KEY='...' \
#     --from-literal=JINA_API_KEY='...' \
#     --from-literal=GOOGLE_PLACES_API_KEY='...'
#
# Note that `kubectl create secret` does NOT put the values in your shell
# history as base64 — but it does put them in your shell history as plaintext.
# Prefer --from-env-file.
#
# A Kubernetes Secret is base64-encoded, not encrypted. At rest in etcd it is
# plaintext unless the cluster enables encryption-at-rest. For a local kind
# cluster that is acceptable; for a real cluster, see ADR-028 on External
# Secrets / SOPS and the existing SSM Parameter Store path (ADR-019).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: equitable-secrets
  namespace: equitable
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://REPLACE_ME:REPLACE_ME@cluster.mongodb.net/?retryWrites=true&w=majority"
  GEMINI_API_KEY: "REPLACE_ME"
  LANGCHAIN_API_KEY: "REPLACE_ME"
  JINA_API_KEY: "REPLACE_ME"
  GOOGLE_PLACES_API_KEY: "REPLACE_ME"
