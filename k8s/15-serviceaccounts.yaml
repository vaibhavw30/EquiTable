# Dedicated ServiceAccounts so the two workloads are distinguishable in audit
# logs and can be bound to different policy later. Neither talks to the
# Kubernetes API, so neither gets a token mounted — an unused token in a pod
# that scrapes untrusted third-party websites is pure downside.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equitable-api
  namespace: equitable
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equitable-refresh
  namespace: equitable
automountServiceAccountToken: false
