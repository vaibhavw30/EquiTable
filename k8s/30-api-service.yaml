apiVersion: v1
kind: Service
metadata:
  name: equitable-api
  namespace: equitable
  labels:
    app.kubernetes.io/name: equitable
    app.kubernetes.io/component: api
spec:
  # ClusterIP, not LoadBalancer/NodePort: the Ingress is the only public door.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: equitable
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http   # the container's named port, so the pod can move off
                         # 8000 without touching this file
      protocol: TCP
    # Scraped by Prometheus via k8s/monitoring/api-servicemonitor.yaml. The
    # Ingress backend names port `http`, so this one is never reachable from
    # outside the cluster.
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
