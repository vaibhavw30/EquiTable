kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: equitable

networking:
  # kind's default CNI (kindnet) does not enforce NetworkPolicy — it accepts
  # the objects and silently ignores them. Since a NetworkPolicy that is not
  # enforced is worse than none (it reads as isolation that does not exist),
  # the default CNI is disabled here and Calico is installed by
  # scripts/k8s-up.sh.
  disableDefaultCNI: true
  # Pod CIDR. NOT Calico's documented default of 192.168.0.0/16 — that default
  # is actively wrong on this host.
  #
  # Docker assigns kind's node IPs from its own bridge network, and OrbStack
  # allocates those in 192.168.x.x (the kind network here is 192.168.107.0/24).
  # A 192.168.0.0/16 pod CIDR therefore CONTAINS the node IPs, so when
  # kube-proxy DNATs a Service ClusterIP to the API server's real node address,
  # Calico treats that address as pod-local and blackholes it. The visible
  # symptom is pods timing out to 10.96.0.1:443 while external egress works
  # fine — which sends you hunting for a policy or DNS bug that isn't there.
  #
  # 10.244.0.0/16 sits outside both the service CIDR (10.96.0.0/16) and every
  # Docker bridge subnet. scripts/k8s-up.sh sets Calico's CALICO_IPV4POOL_CIDR
  # to match; the two MUST agree.
  podSubnet: "10.244.0.0/16"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Marks the node as an eligible target for the ingress-nginx DaemonSet's
      # nodeSelector, which is how the controller gets scheduled here.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Publish the ingress controller's ports on the host, so
      # https://equitable.localtest.me reaches the cluster from a browser or
      # curl with no port-forward.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # A second node so the Deployment's two replicas can actually land on
  # different nodes, and so draining one demonstrates the PodDisruptionBudget.
  - role: worker
